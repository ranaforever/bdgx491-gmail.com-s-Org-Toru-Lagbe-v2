<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B00" />
      <stop offset="50%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9A7" />
      <stop offset="100%" stop-color="#008080" />
    </linearGradient>
  </defs>

  <!-- Sun Rays Array -->
  <g fill="url(#sunGrad)">
    <path d="M 100 240 L 150 232 Q 120 236 100 240 Z" />
    <path d="M 120 180 L 175 192 Q 140 185 120 180 Z" />
    <path d="M 160 120 L 210 150 Q 180 135 160 120 Z" />
    <path d="M 220 70 L 250 115 Q 235 90 220 70 Z" />
    <path d="M 290 50 L 300 105 Q 295 75 290 50 Z" />
    <path d="M 360 70 L 340 120 Q 350 95 360 70 Z" />
    <path d="M 410 120 L 370 155 Q 390 138 410 120 Z" />
    <path d="M 440 180 L 390 198 Q 415 188 440 180 Z" />
  </g>

  <!-- Sun Main Arc -->
  <path d="M 130 250 A 130 130 0 0 1 390 250" fill="none" stroke="url(#sunGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Flying Birds -->
  <path d="M 190 240 Q 200 232 210 240 Q 220 232 230 240" fill="none" stroke="#009688" stroke-width="3" stroke-linecap="round" />
  <path d="M 225 225 Q 233 218 241 225 Q 249 218 257 225" fill="none" stroke="#009688" stroke-width="2.5" stroke-linecap="round" />

  <!-- Palm Tree -->
  <g fill="url(#tealGrad)" stroke="url(#tealGrad)">
    <!-- Trunk -->
    <path d="M 290 250 Q 300 200 330 160 Q 315 195 300 250 Z" />
    <!-- Fronds -->
    <path d="M 330 160 Q 300 150 270 180 Q 300 162 330 160 Z" />
    <path d="M 330 160 Q 320 130 290 125 Q 315 142 330 160 Z" />
    <path d="M 330 160 Q 350 130 380 135 Q 355 145 330 160 Z" />
    <path d="M 330 160 Q 365 155 390 180 Q 360 170 330 160 Z" />
  </g>

  <!-- Main Brand Title: Tour (Red) + লাগবে. (Cyan) -->
  <g font-family="Arial, 'Hind Siliguri', sans-serif">
    <!-- "Tour" slanted bold red text -->
    <text x="120" y="330" font-size="64" font-weight="900" font-style="italic" fill="#FF2A2A" letter-spacing="-1">Tour</text>
    
    <!-- "লাগবে." bold cyan/teal Bengali text -->
    <text x="260" y="330" font-size="54" font-weight="800" fill="#00C9A7">লাগবে.</text>

    <!-- Subtext "আপনার বিশ্বস্ত ভ্রমণ সঙ্গী" -->
    <text x="130" y="370" font-size="22" font-weight="700" fill="#2D3748" letter-spacing="0.5">আপনার বিশ্বস্ত ভ্রমণ সঙ্গী</text>
  </g>
</svg>
